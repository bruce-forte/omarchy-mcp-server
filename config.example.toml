# Omarchy MCP Server -- configuration
#
# This file is optional; everything works without it. Every key below is
# commented out and shows its default, so uncommenting is the only thing that
# changes behaviour, and keys you leave alone keep tracking the defaults as the
# plugin is updated.
#
# Saving this file is enough: the server re-reads it within about two seconds
# and applies it without restarting, so tools switch on and off on clients that
# are already attached. To skip the wait:
#   omarchy-shell io.github.bruce-forte.mcp-server reloadConfig
#
# Two keys still need a restart, because the server is already using them:
# server.port (the socket is bound) and the [log] settings (the file is open).
#
# If this file stops parsing, the server keeps the configuration it already has
# rather than falling back to these defaults, and says so on the desktop.

[server]
# Port the MCP server listens on. Changing it breaks any client already
# configured against the old port; re-run the setup command afterwards:
#   omarchy-shell io.github.bruce-forte.mcp-server clientConfig
# port = 8765

# How long a command may run before it is terminated, in milliseconds. A tool
# call can override this per call.
# timeout_ms = 30000

# Cap on captured output per call, in bytes. Longer output keeps its head and
# tail and drops the middle.
# max_output_b = 262144

# The listen address is always 127.0.0.1 and is deliberately not configurable.
# This server runs commands on your desktop; putting that on the network would
# leave a single bearer token between your machine and everything else on it.

# What an agent is allowed to run is not here. It lives in permissions.json
# beside this file, because two files that both decide it is a second source of
# truth, and because the rules wanted a shape TOML arrays could not carry.
#
# See permissions.example.json, and validate yours with:
#   omarchy-mcpd --check-permissions

[tools]
# Curated tools to switch off by name. Anything disabled here can still be
# reached through omarchy_run, subject to permissions.json.
# disabled = ["omarchy_screenshot", "omarchy_clipboard_write"]

[log]
# debug logs the arguments of every tool call, which is useful when an agent is
# doing something surprising and noisy the rest of the time.
# level = "info"

# Append one JSON line per tool call to
# ~/.local/state/io.github.bruce-forte.mcp-server/activity.jsonl -- what was
# run, what it was understood to act on, whether you approved it, and how it
# ended. This is the only record of what an agent did that outlives the daemon.
# Read the last few with:
#   ~/.config/omarchy/plugins/io.github.bruce-forte.mcp-server/bin/omarchy-mcpd --tail
#
# Command output is never written there: no OCR text, no clipboard reads.
# Arguments are, truncated -- so the file can contain text you copied, and it
# is created 0600. Switch it off if you would rather it did not exist.
# activity = true

# Rotate at this size, keeping one previous generation beside it, so the log
# costs at most twice this on disk. 64 KiB to 64 MiB.
# activity_max_bytes = 1048576

# The name of that file. A name, not a path: it is always created in the state
# directory, because Omarchy reloads the shell on any write inside a plugin
# directory and a log there would reload it once per tool call.
# activity_file = "activity.jsonl"
